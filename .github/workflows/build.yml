name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: xcodebuild -project Macchiato.xcodeproj -scheme Macchiato -configuration Debug build CODE_SIGNING_ALLOWED=NO
